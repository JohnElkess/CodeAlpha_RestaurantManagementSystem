services:
  mongo:
    image: mongo:7
    container_name: restaurant-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: restaurant-api
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Inside the Compose network the database is reachable by its service name, not localhost.
      MONGO_URI: mongodb://mongo:27017/restaurant
      PORT: "3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
